name: Build APK gunzdev
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Tampilkan SHA-1 (untuk Google Cloud OAuth)
        run: keytool -list -v -keystore app/gdev.jks -storepass gdev123 | grep -E "SHA1|SHA256"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gunzdev.apk
      - uses: actions/upload-artifact@v4
        with: { name: gunzdev-apk, path: gunzdev.apk }
